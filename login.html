<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LabDeck - ZDC | Login</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<style>
    :root { --ifma-green: #006633; --ifma-green-light: #00A651; }
    * { box-sizing: border-box; }
    body {
        margin: 0; font-family: 'Inter', system-ui, sans-serif;
        background: radial-gradient(circle at 30% 20%, #0D2818, #071A0F 70%);
        min-height: 100vh; display: flex; align-items: center; justify-content: center;
        color: #fff; padding: 20px;
    }
    .login-box {
        background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
        border-radius: 18px; padding: 40px; width: 100%; max-width: 400px;
        backdrop-filter: blur(10px); box-shadow: 0 30px 60px rgba(0,0,0,0.4);
    }
    .login-box .logo { text-align: center; font-weight: 900; font-size: 1.3rem; margin-bottom: 6px; }
    .login-box .logo span { color: var(--ifma-green-light); }
    .login-box p.sub { text-align: center; color: rgba(255,255,255,0.5); font-size: 0.85rem; margin-bottom: 30px; }

    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 0.78rem; font-weight: 700; color: var(--ifma-green-light); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.4px; }
    .form-group input {
        width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
        background: rgba(255,255,255,0.05); color: #fff; font-size: 0.95rem; outline: none;
    }
    .form-group input:focus { border-color: var(--ifma-green-light); }

    .btn-entrar {
        width: 100%; padding: 13px; border: none; border-radius: 10px; cursor: pointer;
        background: linear-gradient(135deg, var(--ifma-green-light), var(--ifma-green));
        color: white; font-weight: 800; font-size: 0.95rem; margin-top: 8px;
        box-shadow: 0 8px 20px rgba(0,166,81,0.3);
    }
    .btn-entrar:disabled { opacity: 0.6; cursor: not-allowed; }

    .erro-msg { color: #ff6b6b; font-size: 0.82rem; text-align: center; margin-top: 14px; display: none; }
    .voltar { display: block; text-align: center; margin-top: 22px; color: rgba(255,255,255,0.5); text-decoration: none; font-size: 0.85rem; }
    .voltar:hover { color: var(--ifma-green-light); }
</style>
</head>
<body>

<div class="login-box">
    <div class="logo">Lab<span>Deck</span> ZDC</div>
    <p class="sub">Acesso restrito ao painel administrativo</p>

    <div class="form-group">
        <label>E-mail</label>
        <input type="email" id="inputEmail" placeholder="seu.email@ifma.edu.br">
    </div>
    <div class="form-group">
        <label>Senha</label>
        <input type="password" id="inputSenha" placeholder="••••••••">
    </div>

    <button class="btn-entrar" id="btnEntrar" onclick="entrar()">Entrar</button>
    <div class="erro-msg" id="erroMsg"></div>
    <a href="index.html" class="voltar">← Voltar ao início</a>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD1dFH3pUloT370WTQo0NaELA9V0v2tK7U",
        authDomain: "labdeck-zdc.firebaseapp.com",
        projectId: "labdeck-zdc",
        storageBucket: "labdeck-zdc.firebasestorage.app",
        messagingSenderId: "1024127557935",
        appId: "1:1024127557935:web:a9e5ac09adba5caded41da"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    function entrar() {
        const email = document.getElementById('inputEmail').value.trim();
        const senha = document.getElementById('inputSenha').value;
        const erroMsg = document.getElementById('erroMsg');
        const btn = document.getElementById('btnEntrar');

        erroMsg.style.display = 'none';
        if (!email || !senha) {
            erroMsg.innerText = "Preencha e-mail e senha.";
            erroMsg.style.display = 'block';
            return;
        }

        btn.disabled = true; btn.innerText = "Entrando...";
        auth.signInWithEmailAndPassword(email, senha)
            .then(() => window.location.href = "dashboard.html")
            .catch(err => {
                erroMsg.innerText = "E-mail ou senha inválidos.";
                erroMsg.style.display = 'block';
            })
            .finally(() => { btn.disabled = false; btn.innerText = "Entrar"; });
    }

    document.getElementById('inputSenha').addEventListener('keypress', e => { if (e.key === 'Enter') entrar(); });
</script>
</body>
</html>
